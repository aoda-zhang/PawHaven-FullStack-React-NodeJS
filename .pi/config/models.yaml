# Model registry — the one place a lane's intelligence is decided.
#
# An agent and a workflow declare a TIER, never a model. This file resolves the tier.
# `scripts/sync-model-tiers.mjs` writes `.pi/settings.json` from `lanes:` below, and
# `pnpm pi-check` fails when the two disagree, so a lane cannot quietly run at a tier
# other than the one recorded here.
#
# `model: inherit` means "use whatever model the parent session runs on". This repo
# deliberately pins no provider, so every tier inherits today. Pin one by setting
# `model:` on a tier here: every lane at that tier follows, and no agent changes.
#
# `fallback:` is an ordered list of `provider/id` tried when the tier's model is
# unavailable. Empty, because nothing is pinned to fail over from.
#
# Do not put a model name in an agent, a workflow, or a skill. That is the drift this
# file exists to prevent.

version: 1

tiers:
  # Cheap and mechanical: reading, locating, classifying. A wrong answer here is cheap to
  # notice and cheap to redo, so it does not deserve a deep-thinking budget.
  fast:
    capability: classification, scouting
    thinking: low
    model: inherit
    fallback: []

  # Work that writes or drives something and must self-check before it reports. The
  # defaults here are the harness's own measure, not a budget target: `tester` sits at
  # this tier deliberately, because a verification lane that misses a failing check is
  # more expensive than the tokens it would have spent looking.
  balanced:
    capability: implementation, testing, browser_verification
    thinking: medium
    model: inherit
    fallback: []

  # A wrong answer here is expensive to unwind: it is copied into every later stage, or
  # it is the judgement that lets a defect through. Orchestration, plan authorship, plan
  # review, and the code verdict are all this tier.
  strong:
    capability: planning, architecture, review
    thinking: high
    model: inherit
    fallback: []

lanes:
  orchestrator: strong
  scout: fast
  architect: strong
  oracle: strong
  frontend-dev: balanced
  backend-dev: balanced
  tester: balanced
  reviewer: strong
  browser-verifier: balanced
