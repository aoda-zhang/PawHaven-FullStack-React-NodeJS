apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pawhaven-default-deny-ingress
  namespace: pawhaven-test
  labels:
    app.kubernetes.io/part-of: pawhaven
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pawhaven-allow-namespace-ingress
  namespace: pawhaven-test
  labels:
    app.kubernetes.io/part-of: pawhaven
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pawhaven-allow-gateway-ingress
  namespace: pawhaven-test
  labels:
    app.kubernetes.io/part-of: pawhaven
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    # Omitting `from` lets any ingress or tunnel controller reach the gateway,
    # wherever its namespace lives; only the gateway is intended to be public.
    - ports:
        - protocol: TCP
          port: 8080
