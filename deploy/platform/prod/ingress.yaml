apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: pawhaven-prod
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: pawhaven
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.pawhaven.work
      secretName: cloudflare-origin
  rules:
    - host: api.pawhaven.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
