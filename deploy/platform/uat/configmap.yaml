apiVersion: v1
kind: ConfigMap
metadata:
  name: pawhaven-env
  namespace: pawhaven-uat
  labels:
    app.kubernetes.io/name: pawhaven-env
    app.kubernetes.io/part-of: pawhaven
data:
  NODE_ENV: 'uat'
  AUTH_SERVICE_HOST: 'http://auth-service:8082'
  CORE_SERVICE_HOST: 'http://core-service:8081'
  # Replace with the real Vercel origin before deploying this environment.
  DOCUMENT_SERVICE_HOST: 'https://document-service.vercel.app'
