name: Push service image
description: Log in to GitHub Container Registry and push an already built service image.

inputs:
  service:
    description: 'Service name, for example gateway'
    required: true
  tag:
    description: 'Image tag to push'
    required: true
  token:
    description: 'Token used to authenticate against ghcr.io'
    required: true

runs:
  using: composite
  steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Push the image
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TAG: ${{ inputs.tag }}
      run: docker push "ghcr.io/aoda-zhang/pawhaven-${SERVICE}:${TAG}"
