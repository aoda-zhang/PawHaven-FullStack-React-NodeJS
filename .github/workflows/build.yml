# Platform-neutral compile stage. It is reusable so a deploy target can be swapped without
# touching how the code is built: anything platform specific belongs in the calling workflow.
name: Build
run-name: Build-${{ inputs.service }}

on:
  workflow_call:
    inputs:
      service:
        description: 'Workspace package to compile'
        required: true
        type: string

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ inputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Turbo's local cache is content-addressed, so a restored cache makes a repeated compile
      # incremental. The deploy job restores the same key before `vercel build`.
      - name: Restore the Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ inputs.service }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ inputs.service }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ inputs.service }}-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma clients
        if: ${{ inputs.service == 'core-service' || inputs.service == 'auth-service' }}
        shell: bash
        run: pnpm --filter @pawhaven/core-service --filter @pawhaven/auth-service prisma:generate-mongodb

      # Deliberately the same command the Vercel projects run (`turbo:build`), including
      # `--env-mode=loose`. The env mode is part of Turbo's task hash, so a different flag here
      # would make every cache entry unusable inside `vercel build`.
      - name: Compile
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          pnpm_config_verify_deps_before_run=false \
            pnpm --filter "@pawhaven/${SERVICE}" run turbo:build

      - name: Typecheck
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          pnpm_config_verify_deps_before_run=false \
            pnpm exec turbo run typecheck --filter="@pawhaven/${SERVICE}..."
