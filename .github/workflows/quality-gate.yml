# The merge gate. Pull requests into `develop` (or `main`) run it, and the branch protection on
# `develop` requires these jobs before a merge is allowed. The same checks run after a merge to
# `develop`, so a post-merge regression is visible immediately.
name: Quality Gate
run-name: Quality Gate · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Architecture boundaries
        shell: bash
        run: pnpm architecture-check

      - name: Design token audit
        shell: bash
        run: pnpm token-check

      - name: Repository quality
        shell: bash
        run: pnpm quality-check

      - name: Translation keys
        shell: bash
        run: pnpm check:i18n

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Install Chromium for the accessibility tests
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        shell: bash
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Build
        shell: bash
        run: pnpm build

  e2e:
    name: End-to-end
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Install Playwright browser
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Critical journeys
        shell: bash
        run: pnpm test:e2e
