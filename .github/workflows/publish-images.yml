name: Publish Images

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check; defaults to the dispatched commit'
        required: false
        type: string
      version:
        description: 'Image tag to publish, for example v26.11.17'
        required: true
        type: string
      services:
        description: 'Services to publish: all, or a JSON array of service names'
        required: false
        type: string
        default: 'all'
      include_document_service:
        description: 'Also publish services marked apps/backend/<service>/deploy/.out-of-pipeline'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  select:
    name: Select the services to publish
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Compute the publish matrix
        id: matrix
        shell: bash
        env:
          SERVICES: ${{ inputs.services }}
          INCLUDE_OUT_OF_PIPELINE: ${{ inputs.include_document_service }}
        run: |
          set -euo pipefail

          services=()
          for dockerfile in apps/backend/*/deploy/Dockerfile; do
            [[ -f "${dockerfile}" ]] || continue
            deploy_dir="$(dirname "${dockerfile}")"
            service="$(basename "$(dirname "${deploy_dir}")")"
            if [[ -e "${deploy_dir}/.out-of-pipeline" && "${INCLUDE_OUT_OF_PIPELINE}" != "true" ]]; then
              echo "Skipping ${service}; it is marked out of the publishing pipeline."
              continue
            fi
            services+=("${service}")
          done

          if ((${#services[@]} == 0)); then
            echo "::error::No service declares apps/backend/<service>/deploy/Dockerfile."
            exit 1
          fi
          discovered="$(printf '%s\n' "${services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"

          if [[ "${SERVICES}" == "all" ]]; then
            selected="${discovered}"
          else
            requested="$(jq -ce 'if type == "array" then . else error("not an array") end' <<<"${SERVICES}" 2>/dev/null)" || {
              echo "::error::services must be all or a JSON array of service names; received ${SERVICES}."
              exit 1
            }
            ignored="$(jq -cn \
              --argjson discovered "${discovered}" \
              --argjson requested "${requested}" \
              '$requested | map(select(. as $service | $discovered | index($service) == null))')"
            if [[ "${ignored}" != '[]' ]]; then
              echo "::warning::Not published; no deploy/Dockerfile or marked out of the pipeline: ${ignored}."
            fi
            selected="$(jq -cn \
              --argjson discovered "${discovered}" \
              --argjson requested "${requested}" \
              '$discovered | map(select(. as $service | $requested | index($service) != null))')"
          fi

          if [[ "${selected}" == '[]' ]]; then
            echo "::error::None of the requested services (${SERVICES}) can be published."
            exit 1
          fi

          matrix="$(jq -cn \
            --argjson selected "${selected}" \
            '{include: ($selected | map({
                service: .,
                dockerfile: ("apps/backend/" + . + "/deploy/Dockerfile")
              }))}')"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.service }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version tag already exists
        id: existing
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/aoda-zhang/pawhaven-${SERVICE}:${VERSION}"
          attempts=3
          last_error=""
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if inspect_output="$(docker buildx imagetools inspect "${image}" 2>&1)"; then
              echo "build=false" >>"${GITHUB_OUTPUT}"
              echo "::notice::${image} already exists and is kept as published."
              exit 0
            fi
            last_error="${inspect_output//$'\n'/ }"
            if grep -qiE 'no such manifest|manifest unknown|not found|does not exist' <<<"${inspect_output}"; then
              echo "build=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            if ((attempt < attempts)); then
              echo "::warning::Could not inspect ${image} on attempt ${attempt}/${attempts}: ${last_error}"
              sleep 5
            fi
          done
          echo "::error::Could not determine whether ${image} exists after ${attempts} attempts; refusing to overwrite an existing tag. Last error: ${last_error}"
          exit 1

      - name: Build the image
        if: ${{ steps.existing.outputs.build == 'true' }}
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          tag: ${{ inputs.version }}
          dockerfile: ${{ matrix.dockerfile }}

      - name: Push the image
        if: ${{ steps.existing.outputs.build == 'true' }}
        uses: ./.github/actions/push-image
        with:
          service: ${{ matrix.service }}
          tag: ${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
