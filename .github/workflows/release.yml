name: Release
run-name: Release-${{ inputs.service }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build, push and deploy to production'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service

permissions:
  contents: read

jobs:
  precheck:
    name: Check the release ref
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatching branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

  resolve:
    name: Compute the release version
    needs: precheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="v$(TZ=Asia/Shanghai date +%y.%m.%d)-${GITHUB_SHA:0:7}"
          echo "Releasing ${version} from ${GITHUB_SHA}."
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Map the service selection to a service list
        id: services
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          services="$(jq -cn --arg service "${SERVICE}" '[$service]')"
          echo "services=${services}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.service }}
    needs: [resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Build the image
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          tag: ${{ needs.resolve.outputs.version }}
          dockerfile: apps/backend/${{ matrix.service }}/deploy/Dockerfile

  approve:
    name: Approve the production release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Await approval
        run: echo "Production release approved."

  push-image:
    name: Push ${{ matrix.service }} to ACR
    needs: [resolve, build, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Push the image
        uses: ./.github/actions/push-image
        with:
          service: ${{ matrix.service }}
          tag: ${{ needs.resolve.outputs.version }}
          registry: crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com
          repository: pahaven/pawhaven-${{ matrix.service }}
          username: ${{ secrets.ACR_USERNAME }}
          token: ${{ secrets.ACR_PASSWORD }}

  deploy:
    name: Deploy to prod
    needs: [resolve, push-image]
    concurrency:
      group: pawhaven-prod
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      ref: ${{ github.sha }}
      environment: prod
      namespace: pawhaven-prod
      version: ${{ needs.resolve.outputs.version }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
