name: Release
run-name: Release-${{ inputs.service }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to release to Vercel production'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service

permissions:
  contents: read

jobs:
  precheck:
    name: Check the release ref
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatching branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

  release:
    name: Release ${{ inputs.service }} to production
    needs: [precheck]
    runs-on: ubuntu-latest
    # The `prod` environment carries the required-reviewer gate, so a release only
    # reaches Vercel production after an explicit approval.
    environment: prod
    concurrency:
      group: vercel-prod-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve the Vercel project
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          PROJECT_GATEWAY: ${{ secrets.VERCEL_PROJECT_ID_GATEWAY }}
          PROJECT_CORE: ${{ secrets.VERCEL_PROJECT_ID_CORE_SERVICE }}
          PROJECT_AUTH: ${{ secrets.VERCEL_PROJECT_ID_AUTH_SERVICE }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          case "${SERVICE}" in
            gateway) project="${PROJECT_GATEWAY}" ;;
            core-service) project="${PROJECT_CORE}" ;;
            auth-service) project="${PROJECT_AUTH}" ;;
            *) echo "::error::No Vercel project mapped for ${SERVICE}."; exit 1 ;;
          esac
          missing=""
          if [ -z "${ORG}" ]; then missing="${missing} VERCEL_ORG_ID"; fi
          if [ -z "${TOKEN}" ]; then missing="${missing} VERCEL_TOKEN"; fi
          if [ -z "${project}" ]; then missing="${missing} VERCEL_PROJECT_ID (${SERVICE})"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}."
            exit 1
          fi
          {
            echo "VERCEL_ORG_ID=${ORG}"
            echo "VERCEL_PROJECT_ID=${project}"
            echo "VERCEL_TOKEN=${TOKEN}"
          } >>"${GITHUB_ENV}"

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the production settings
        run: vercel pull --yes --environment=production

      - name: Build for production
        run: vercel build --prod

      - name: Deploy to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod)"
          echo "url=${url}" >>"${GITHUB_OUTPUT}"
          {
            echo "### ${{ inputs.service }} production"
            echo
            echo "${url}"
          } >>"${GITHUB_STEP_SUMMARY}"
