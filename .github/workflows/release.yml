name: Release
run-name: Release-${{ inputs.service }}

# Production is a promotion, not a rebuild: a backend service promotes the Vercel deployment you
# verified in `deploy.yml`, and the portal deploys the artifact that run built. Either way
# production runs exactly the artifact that was reviewed.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to release to production'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
          - portal
      deployment:
        description: 'Vercel preview deployment URL (backend services only)'
        required: false
        type: string
        default: ''
      deploy_run_id:
        description: 'deploy.yml run ID that produced portal-build (portal only)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  precheck:
    name: Check the release request
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatching branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

      - name: Verify the release inputs
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          DEPLOYMENT: ${{ inputs.deployment }}
          RUN_ID: ${{ inputs.deploy_run_id }}
        run: |
          set -euo pipefail
          if [ "${SERVICE}" = "portal" ]; then
            if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "::error::deploy_run_id must be the numeric run ID of a successful deploy.yml run, got '${RUN_ID}'."
              exit 1
            fi
          else
            case "${DEPLOYMENT}" in
              https://*) ;;
              *) echo "::error::deployment must be a Vercel deployment URL, got '${DEPLOYMENT}'."; exit 1 ;;
            esac
          fi

  vercel:
    name: Release ${{ inputs.service }} to Vercel production
    needs: [precheck]
    if: inputs.service != 'portal'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      mode: production
      service: ${{ inputs.service }}
      deployment: ${{ inputs.deployment }}
    secrets: inherit

  cloudflare:
    name: Release portal to Cloudflare Pages production
    needs: [precheck]
    if: inputs.service == 'portal'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      mode: production
      deploy_run_id: ${{ inputs.deploy_run_id }}
    secrets: inherit
