name: Release
run-name: Release-${{ inputs.service }}

# One manual production entry point. The build jobs produce the deploy artifact and the deploy
# workflows publish it directly to production after the `prod` environment approval; there is no
# preview deployment and no promotion step.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to release to production'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
          - portal

permissions:
  contents: read

jobs:
  precheck:
    name: Check the release request
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatching branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

  build-vercel:
    name: Build ${{ inputs.service }}
    needs: [precheck]
    if: inputs.service != 'portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for Vercel
        uses: ./.github/actions/build-vercel
        with:
          service: ${{ inputs.service }}
          vercelToken: ${{ secrets.VERCEL_TOKEN }}
          vercelOrgId: ${{ secrets.VERCEL_ORG_ID }}
          projectGateway: ${{ secrets.VERCEL_PROJECT_ID_GATEWAY }}
          projectCore: ${{ secrets.VERCEL_PROJECT_ID_CORE_SERVICE }}
          projectAuth: ${{ secrets.VERCEL_PROJECT_ID_AUTH_SERVICE }}

  build-cloudflare:
    name: Build portal
    needs: [precheck]
    if: inputs.service == 'portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for Cloudflare Pages
        uses: ./.github/actions/build-cloudflare
        with:
          service: ${{ inputs.service }}
          appEnv: prod
          version: ${{ github.sha }}
          apiBaseUrl: ${{ vars.PAWHAVEN_PORTAL_API_BASE_URL }}

  vercel:
    name: Release ${{ inputs.service }} to Vercel production
    needs: [precheck, build-vercel]
    if: inputs.service != 'portal'
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      service: ${{ inputs.service }}
    secrets: inherit

  cloudflare:
    name: Release portal to Cloudflare Pages production
    needs: [precheck, build-cloudflare]
    if: inputs.service == 'portal'
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
