name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - uat
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service

permissions:
  contents: read
  packages: read

concurrency:
  group: pawhaven-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  precheck:
    name: Check the deploy ref
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatching branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Deploys run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    needs: precheck
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: tag
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: ./.github/actions/build-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ steps.tag.outputs.tag }}
          dockerfile: apps/backend/${{ inputs.service }}/deploy/Dockerfile

  push-ghcr:
    name: Push ${{ inputs.service }} to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Push the image
        uses: ./.github/actions/push-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ needs.build.outputs.tag }}
          registry: ghcr.io
          repository: aoda-zhang/pawhaven-${{ inputs.service }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-test:
    name: Deploy to test
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'test' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: test
      namespace: pawhaven-test
      ref: ${{ github.sha }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_TEST }}

  deploy-uat:
    name: Deploy to uat
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'uat' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: uat
      namespace: pawhaven-uat
      ref: ${{ github.sha }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_UAT }}
