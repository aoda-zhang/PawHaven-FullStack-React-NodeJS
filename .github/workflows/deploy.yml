name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - uat
          - prod
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
      branch:
        description: 'Branch to build and deploy'
        required: true
        type: string
        default: develop

permissions:
  contents: read
  packages: read

concurrency:
  group: pawhaven-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve image tag
        id: tag
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: ./.github/actions/build-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ steps.tag.outputs.tag }}
          dockerfile: apps/backend/${{ inputs.service }}/deploy/Dockerfile

  push-ghcr:
    name: Push ${{ inputs.service }} to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Push the image
        uses: ./.github/actions/push-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ needs.build.outputs.tag }}
          registry: ghcr.io
          repository: aoda-zhang/pawhaven-${{ inputs.service }}
          token: ${{ secrets.GITHUB_TOKEN }}

  approve-prod:
    name: Approve the production deployment
    needs: push-ghcr
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Await approval
        run: echo "Production deployment approved."

  deploy-test:
    name: Deploy to test
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'test' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: test
      namespace: pawhaven-test
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_TEST }}

  deploy-uat:
    name: Deploy to uat
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'uat' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: uat
      namespace: pawhaven-uat
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_UAT }}

  deploy-prod:
    name: Deploy to prod
    needs: [build, push-ghcr, approve-prod]
    if: ${{ inputs.environment == 'prod' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: prod
      namespace: pawhaven-prod
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
