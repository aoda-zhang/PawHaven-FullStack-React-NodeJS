name: Deploy
run-name: Deploy-${{ inputs.service }}-preview

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'portal → Cloudflare Pages preview; backend services → Vercel preview'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
          - portal

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  build-vercel:
    name: Build ${{ inputs.service }}
    if: inputs.service != 'portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for Vercel
        uses: ./.github/actions/build-vercel
        with:
          service: ${{ inputs.service }}
          vercelToken: ${{ secrets.VERCEL_TOKEN }}
          vercelOrgId: ${{ secrets.VERCEL_ORG_ID }}
          projectGateway: ${{ secrets.VERCEL_PROJECT_ID_GATEWAY }}
          projectCore: ${{ secrets.VERCEL_PROJECT_ID_CORE_SERVICE }}
          projectAuth: ${{ secrets.VERCEL_PROJECT_ID_AUTH_SERVICE }}

  build-cloudflare:
    name: Build portal
    if: inputs.service == 'portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for Cloudflare Pages
        uses: ./.github/actions/build-cloudflare
        with:
          service: ${{ inputs.service }}
          appEnv: prod
          version: ${{ github.sha }}
          apiBaseUrl: ${{ vars.PAWHAVEN_PORTAL_API_BASE_URL }}

  vercel:
    name: Vercel preview
    if: inputs.service != 'portal'
    needs: [build-vercel]
    uses: ./.github/workflows/deploy-vercel.yml
    with:
      mode: preview
      service: ${{ inputs.service }}
    secrets: inherit

  cloudflare:
    name: Cloudflare Pages preview
    if: inputs.service == 'portal'
    needs: [build-cloudflare]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      mode: preview
    secrets: inherit
