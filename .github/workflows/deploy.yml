name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - uat
          - prod
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
      branch:
        description: 'Branch to build and deploy'
        required: true
        type: string
        default: develop

permissions:
  contents: read
  packages: read

concurrency:
  group: pawhaven-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve image tag
        id: tag
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/${{ inputs.service }}/deploy/Dockerfile
          push: false
          load: true
          tags: pawhaven-${{ inputs.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Save the image
        shell: bash
        run: docker save -o image.tar pawhaven-${{ inputs.service }}:${{ steps.tag.outputs.tag }}

      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawhaven-${{ inputs.service }}-${{ steps.tag.outputs.tag }}
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  push-ghcr:
    name: Push ${{ inputs.service }} to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the image artifact
        uses: actions/download-artifact@v4
        with:
          name: pawhaven-${{ inputs.service }}-${{ needs.build.outputs.tag }}

      - name: Load the image
        shell: bash
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image for GHCR
        shell: bash
        run: docker tag pawhaven-${{ inputs.service }}:${{ needs.build.outputs.tag }} ghcr.io/aoda-zhang/pawhaven-${{ inputs.service }}:${{ needs.build.outputs.tag }}

      - name: Push image to GHCR
        shell: bash
        run: docker push ghcr.io/aoda-zhang/pawhaven-${{ inputs.service }}:${{ needs.build.outputs.tag }}

  approve-prod:
    name: Approve the production deployment
    needs: push-ghcr
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Await approval
        run: echo "Production deployment approved."

  deploy-test:
    name: Deploy to test
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'test' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: test
      namespace: pawhaven-test
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_TEST }}

  deploy-uat:
    name: Deploy to uat
    needs: [build, push-ghcr]
    if: ${{ inputs.environment == 'uat' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: uat
      namespace: pawhaven-uat
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_UAT }}

  deploy-prod:
    name: Deploy to prod
    needs: [build, push-ghcr, approve-prod]
    if: ${{ inputs.environment == 'prod' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: prod
      namespace: pawhaven-prod
      ref: ${{ inputs.branch }}
      version: ${{ needs.build.outputs.tag }}
      services: '["${{ inputs.service }}"]'
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
