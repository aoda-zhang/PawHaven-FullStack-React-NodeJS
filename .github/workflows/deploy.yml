name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - uat
          - prod
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        default: gateway
        options:
          - gateway
          - core-service
          - auth-service
      version:
        description: 'Existing image tag to deploy; leave empty to build sha-<7> from this commit'
        required: false
        type: string
      branch:
        description: 'Branch to build and deploy; must exist on origin (default develop)'
        required: true
        type: string
        default: develop

permissions:
  contents: read
  packages: read

concurrency:
  group: pawhaven-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the image tag and service
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      services: ${{ steps.services.outputs.services }}
      build: ${{ steps.tag.outputs.build }}
      ref: ${{ steps.branch.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Resolve the branch head
        id: branch
        shell: bash
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          branch_sha="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ -z "${branch_sha}" ]]; then
            available="$(git ls-remote --heads origin | awk '{print $2}' \
              | sed 's|^refs/heads/||' | sort | paste -sd ',' - | sed 's/,/, /g')"
            echo "::error::Branch '${BRANCH}' does not exist on origin. Available branches: ${available:-none}."
            exit 1
          fi
          echo "sha=${branch_sha}" >>"${GITHUB_OUTPUT}"
          echo "ref=${BRANCH}" >>"${GITHUB_OUTPUT}"

      - name: Require main for production
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ "${ENVIRONMENT}" == "prod" && "${BRANCH}" != "main" ]]; then
            echo "::error::Production deploys run from main only; this run targets ${BRANCH}."
            exit 1
          fi

      - name: Map the service selection to a service list
        id: services
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          services="$(jq -cn --arg service "${SERVICE}" '[$service]')"
          echo "services=${services}" >>"${GITHUB_OUTPUT}"

      - name: Resolve the image tag
        id: tag
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BRANCH_SHA: ${{ steps.branch.outputs.sha }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_VERSION}"
          build=true
          if [[ -n "${tag}" ]]; then
            tag_pattern='^(v[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?|sha-[0-9a-f]{7})$'
            if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
              echo "::error::Image tag '${tag}' must match ${tag_pattern}, such as v26.11.17, v26.11.17-2 or sha-abc1234."
              exit 1
            fi
            build=false
          else
            tag="sha-${BRANCH_SHA::7}"
          fi
          echo "Resolved ${tag}; build=${build}."
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "build=${build}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: ${{ steps.tag.outputs.build == 'false' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ steps.tag.outputs.build == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the requested image tag exists
        if: ${{ steps.tag.outputs.build == 'false' }}
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          set -euo pipefail
          missing=0
          for service in $(jq -r '.[]' <<<"${SERVICES}"); do
            image="ghcr.io/aoda-zhang/pawhaven-${service}:${TAG}"
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "Found ${image}."
            else
              echo "::error::${image} does not exist; leave version empty to build it or pass a published tag."
              missing=$((missing + 1))
            fi
          done
          if ((missing > 0)); then
            exit 1
          fi

  check:
    name: Check the dispatched commit
    needs: resolve
    if: ${{ needs.resolve.outputs.build == 'true' }}
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  approve-prod:
    name: Approve the production deployment
    needs: resolve
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Await approval
        run: echo "Production deployment approved."

  build-push:
    name: Build and push the image
    needs: [resolve, check, approve-prod]
    if: ${{ always() && !cancelled() && !failure() && needs.resolve.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Build the image
        uses: ./.github/actions/build-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ needs.resolve.outputs.tag }}
          dockerfile: apps/backend/${{ inputs.service }}/deploy/Dockerfile

      - name: Push the image
        uses: ./.github/actions/push-image
        with:
          service: ${{ inputs.service }}
          tag: ${{ needs.resolve.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-test:
    name: Deploy to test
    needs: [resolve, build-push]
    if: ${{ always() && !cancelled() && !failure() && inputs.environment == 'test' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: test
      namespace: pawhaven-test
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.tag }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_TEST }}

  deploy-uat:
    name: Deploy to uat
    needs: [resolve, build-push]
    if: ${{ always() && !cancelled() && !failure() && inputs.environment == 'uat' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: uat
      namespace: pawhaven-uat
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.tag }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_UAT }}

  deploy-prod:
    name: Deploy to prod
    needs: [resolve, build-push, approve-prod]
    if: ${{ always() && !cancelled() && !failure() && inputs.environment == 'prod' }}
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: prod
      namespace: pawhaven-prod
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.tag }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
