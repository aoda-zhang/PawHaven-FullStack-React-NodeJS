name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: test
        options:
          - test
          - uat
          - prod
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        default: all
        options:
          - all
          - gateway
          - core-service
          - auth-service
      version:
        description: 'Image tag to deploy; leave empty to use the latest v* tag'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: pawhaven-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the image tag and services
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the main branch for production
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "${ENVIRONMENT}" == "prod" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deploys run from main only; this run uses ${GITHUB_REF}."
            exit 1
          fi

      - name: Resolve the image tag
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION}"
          git fetch --tags --force origin
          if [[ -z "${version}" ]]; then
            version="$(git for-each-ref --sort=-creatordate --count=1 \
              --format='%(refname:short)' 'refs/tags/v[0-9][0-9].[0-9][0-9].[0-9][0-9]*')"
            if [[ -z "${version}" ]]; then
              echo "::error::No vYY.MM.DD tag exists yet; pass a version or run release.yml first."
              exit 1
            fi
            echo "Selected the latest tag ${version}."
          fi
          version_pattern='^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$'
          if [[ ! "${version}" =~ ${version_pattern} ]]; then
            echo "::error::Image tag '${version}' must match ${version_pattern}, such as v26.11.17 or v26.11.17-2."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::Tag ${version} does not exist in this repository."
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Map the service selection to a service list
        id: services
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [[ "${SERVICE}" == "all" ]]; then
            discovered=()
            for dockerfile in apps/backend/*/deploy/Dockerfile; do
              [[ -f "${dockerfile}" ]] || continue
              deploy_dir="$(dirname "${dockerfile}")"
              service="$(basename "$(dirname "${deploy_dir}")")"
              if [[ -e "${deploy_dir}/.out-of-pipeline" ]]; then
                echo "Skipping ${service}; it is marked out of the deployment pipeline."
                continue
              fi
              discovered+=("${service}")
            done
            if ((${#discovered[@]} == 0)); then
              echo "::error::No service declares apps/backend/<service>/deploy/Dockerfile."
              exit 1
            fi
            services="$(printf '%s\n' "${discovered[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          else
            services="$(jq -cn --arg service "${SERVICE}" '[$service]')"
          fi
          echo "services=${services}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the image tag exists for every selected service
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVICES: ${{ steps.services.outputs.services }}
        run: |
          set -euo pipefail
          missing=0
          for service in $(jq -r '.[]' <<<"${SERVICES}"); do
            image="ghcr.io/aoda-zhang/pawhaven-${service}:${VERSION}"
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "Found ${image}."
            else
              echo "::error::${image} does not exist; publish it through release.yml first."
              missing=$((missing + 1))
            fi
          done
          if ((missing > 0)); then
            exit 1
          fi

  approve-prod:
    name: Approve the production deployment
    needs: resolve
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Await approval
        run: echo "Production deployment approved."

  deploy-test:
    name: Deploy to test
    if: ${{ inputs.environment == 'test' }}
    needs: resolve
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: test
      namespace: pawhaven-test
      version: ${{ needs.resolve.outputs.version }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_TEST }}

  deploy-uat:
    name: Deploy to uat
    if: ${{ inputs.environment == 'uat' }}
    needs: resolve
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: uat
      namespace: pawhaven-uat
      version: ${{ needs.resolve.outputs.version }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_UAT }}

  deploy-prod:
    name: Deploy to prod
    if: ${{ inputs.environment == 'prod' }}
    needs: [resolve, approve-prod]
    uses: ./.github/workflows/deploy-k3s.yml
    with:
      environment: prod
      namespace: pawhaven-prod
      version: ${{ needs.resolve.outputs.version }}
      services: ${{ needs.resolve.outputs.services }}
    secrets:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PROD }}
