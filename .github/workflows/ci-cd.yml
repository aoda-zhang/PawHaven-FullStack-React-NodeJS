name: CI/CD

on:
  push:
    branches: [main, develop, cicd]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Adjust if you need more memory for turbo builds
  NODE_OPTIONS: --max-old-space-size=4096
  PNPM_HOME: /home/runner/setup-pnpm

jobs:
  checks:
    name: Lint / Security / Token / Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint
        # Best practice: fail fast on style issues before build

      - name: Security audit
        run: pnpm audit --audit-level=moderate
        # If you prefer stricter: --audit-level=low; add --ignore-practical for dev-only false positives

      - name: Design-token check
        run: node packages/design-system/scripts/token-check.cjs
        # Scans apps/frontend and packages/ui against design-system tokens

      # Optional but recommended industry practice for Nest/TS backend
      - name: Type-check backend (gateway representative)
        run: pnpm --filter @pawhaven/gateway typecheck
        continue-on-error: true

  build:
    name: Install + Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace (backend + packages)
        run: pnpm build
        # Uses turbo; builds all apps/packages with build script

      - name: Build portal (Cloudflare frontend)
        run: pnpm --filter @pawhaven/portal build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            apps/backend/*/dist
            apps/backend/gateway/dist
          retention-days: 2

      - name: Upload portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: apps/frontend/portal/dist
          retention-days: 2

  deploy-backend-dev:
    name: Deploy backend to Vercel (dev)
    needs: build
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: backend-dist, path: ./dist-backend }
      - name: Deploy Vercel dev
        id: deploy
        run: |
          npx vercel@latest deploy --token=${{ secrets.VERCEL_TOKEN_DEV }} --org-id=${{ secrets.VERCEL_ORG_ID_DEV }} --project-id=${{ secrets.VERCEL_PROJECT_ID_BACKEND_DEV }} --cwd=apps/backend/gateway
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_DEV }}

  deploy-backend-uat:
    name: Deploy backend to Vercel (uat)
    needs: build
    if: ${{ github.ref == 'refs/heads/cicd' }}
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: backend-dist, path: ./dist-backend }
      - name: Deploy Vercel uat
        id: deploy
        run: |
          npx vercel@latest deploy --token=${{ secrets.VERCEL_TOKEN_UAT }} --org-id=${{ secrets.VERCEL_ORG_ID_UAT }} --project-id=${{ secrets.VERCEL_PROJECT_ID_BACKEND_UAT }} --cwd=apps/backend/gateway
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_UAT }}

  deploy-backend-prod:
    name: Deploy backend to Vercel (prod)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: backend-dist, path: ./dist-backend }
      - name: Deploy Vercel prod
        id: deploy
        run: |
          npx vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN_PROD }} --org-id=${{ secrets.VERCEL_ORG_ID_PROD }} --project-id=${{ secrets.VERCEL_PROJECT_ID_BACKEND_PROD }} --cwd=apps/backend/gateway
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PROD }}

  deploy-portal-dev:
    name: Deploy portal to Cloudflare (dev)
    needs: build
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://pawhaven-portal-dev.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: portal-dist, path: ./portal-dist }
      - run: |
          npx wrangler@latest pages publish ./portal-dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME_DEV }} --branch=develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEV }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_DEV }}

  deploy-portal-uat:
    name: Deploy portal to Cloudflare (uat)
    needs: build
    if: ${{ github.ref == 'refs/heads/cicd' }}
    runs-on: ubuntu-latest
    environment:
      name: uat
      url: https://pawhaven-portal-uat.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: portal-dist, path: ./portal-dist }
      - run: |
          npx wrangler@latest pages publish ./portal-dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME_UAT }} --branch=cicd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_UAT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_UAT }}

  deploy-portal-prod:
    name: Deploy portal to Cloudflare (prod)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://pawhaven-portal.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: portal-dist, path: ./portal-dist }
      - run: |
          npx wrangler@latest pages publish ./portal-dist --project-name=${{ secrets.CF_PAGES_PROJECT_NAME_PROD }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}
