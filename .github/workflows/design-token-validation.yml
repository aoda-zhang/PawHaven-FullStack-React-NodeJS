name: Design Token Validation

on:
  pull_request:
    paths:
      - "packages/design-system/**"
      - "packages/ui/**"
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/design-token-validation.yml"
  push:
    branches:
      - main
    paths:
      - "packages/design-system/**"
      - "packages/ui/**"
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/design-token-validation.yml"

permissions:
  contents: read

jobs:
  design-token-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable package manager
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test token contract analyzer
        run: pnpm --filter @pawhaven/design-system test:tokens

      - name: Check design token contract and frontend styles
        run: pnpm token-check

      - name: Build generated design tokens
        run: pnpm --filter @pawhaven/design-system build:tokens
