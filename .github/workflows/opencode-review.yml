name: OpenCode Read-only Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Architecture and quality review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@v1.19.4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai/gpt-5
          agent: pr-reviewer
          use_github_token: true
          prompt: |
            Review this pull request in read-only mode using the repository's pr-reviewer agent.
            Focus on whether the changed code follows the current PawHaven architecture and team conventions.
            Review component/design-system usage, styling/design tokens, i18n, accessibility,
            performance, security, correctness, and tests as relevant to the diff.
            Do not modify files, run commands, push commits, or attempt to implement fixes.
            Report actionable findings with severity, confidence, changed file/line, evidence,
            impact, and a concrete recommendation. If there are no actionable findings, say so.
