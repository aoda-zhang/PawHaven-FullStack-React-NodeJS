name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run OpenCode PR reviewer
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"pr-reviewer"}'
        with:
          model: opencode/mimo-v2.6-flash-free
          agent: pr-reviewer
          use_github_token: true
          prompt: |
            Review only the current pull request diff. Treat the diff supplied by
            the GitHub review action as the source of scope. Inspect only changed
            files and the minimum directly relevant context needed to validate
            findings. Do not scan/search the repository, read unrelated docs,
            enumerate directories, run builds/tests, or use subagents. Stop once
            there is enough evidence to report actionable findings. Do not modify
            files or the pull request. Report severity, confidence, changed
            file/line, evidence, impact, and a concrete recommendation. If no
            actionable findings exist, say so and note any limitations.
