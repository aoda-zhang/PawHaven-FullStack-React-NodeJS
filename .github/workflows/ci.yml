# The merge gate. Every pull request into `develop` (or `main`) runs it, and the branch
# protection on `develop` requires these jobs before a merge is allowed. The same checks run
# again after a merge to `develop`, so a post-merge regression is visible immediately.
name: 门禁
run-name: 门禁 · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Architecture boundaries
        shell: bash
        run: pnpm architecture-check

      - name: Design token audit
        shell: bash
        run: pnpm token-check

      - name: Repository quality
        shell: bash
        run: pnpm quality-check

      - name: Translation keys
        shell: bash
        run: pnpm check:i18n

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: pnpm typecheck

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Unit and accessibility tests
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests
        shell: bash
        run: pnpm test

  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Build
        shell: bash
        run: pnpm build

  e2e:
    name: 端到端
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Install Playwright browser
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Critical journeys
        shell: bash
        run: pnpm test:e2e
