name: Mirror image to ACR

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source image, fully qualified (registry/repository:tag)'
        required: true
        type: string
      target_repository:
        description: 'ACR repository path, for example pahaven/traefik'
        required: true
        type: string
      target_tag:
        description: 'Tag to publish in ACR'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror ${{ inputs.source }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull, retag and push
        shell: bash
        run: |
          set -euo pipefail
          target="crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com/${{ inputs.target_repository }}:${{ inputs.target_tag }}"
          docker pull "${{ inputs.source }}"
          docker tag "${{ inputs.source }}" "${target}"
          docker push "${target}"
          echo "Published ${target}"
