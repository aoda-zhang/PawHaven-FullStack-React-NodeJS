name: UI Library

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/ui/**'
      - 'packages/design-system/**'
      - 'apps/frontend/portal/**'
      - '.github/workflows/ui-library.yml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/design-system/**'
      - 'apps/frontend/portal/**'
      - '.github/workflows/ui-library.yml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

# Pull requests cancel superseded runs of the same PR; pushes to main cancel superseded
# pushes. Any other event gets its own run id so it never joins a PR or push group.
concurrency:
  group: ui-library-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  ui-library:
    name: UI package, accessibility tests and Portal CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check design tokens
        run: pnpm token-check

      - name: Build UI package and its workspace dependencies
        run: pnpm --filter @pawhaven/ui... build

      - name: Verify UI package contract (exports map, build output, sideEffects)
        run: pnpm --filter @pawhaven/ui verify:package

      - name: Test UI components
        run: pnpm --filter @pawhaven/ui test

      - name: Build Portal and its workspace dependencies
        run: pnpm --filter @pawhaven/portal... build

      - name: Verify production CSS retains design-system tokens and UI utilities
        shell: bash
        run: |
          set -euo pipefail
          CSS_FILES=$(find apps/frontend/portal/build -type f -name '*.css' -print)
          if [[ -z "${CSS_FILES}" ]]; then
            echo "Portal production build emitted no CSS files." >&2
            exit 1
          fi
          if ! grep -qE -- '--color-(primary|text)|--font-sans' ${CSS_FILES}; then
            echo "Expected design-system CSS tokens were not found in the Portal bundle." >&2
            exit 1
          fi
          if ! grep -qF -- ".animate-spin" ${CSS_FILES}; then
            echo "Expected UI-library animation utility was not found in the Portal bundle." >&2
            exit 1
          fi
