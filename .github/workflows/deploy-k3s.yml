name: Deploy Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment: test, uat or prod'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy; defaults to the dispatched commit'
        required: false
        type: string
      version:
        description: 'Image tag to deploy'
        required: true
        type: string
      services:
        description: 'JSON array of services to deploy'
        required: true
        type: string
    secrets:
      KUBECONFIG_B64:
        description: 'Base64 encoded kubeconfig for the target cluster'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      NAMESPACE: ${{ inputs.namespace }}
      VERSION: ${{ inputs.version }}
      SERVICES: ${{ inputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply platform resources
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f "deploy/platform/${ENVIRONMENT}"

      - name: Deploy services
        shell: bash
        run: |
          set -euo pipefail
          for service in $(jq -r '.[]' <<<"${SERVICES}"); do
            tmp="$(mktemp -d)"
            cp -R "apps/backend/${service}/deploy/kubernetes/${ENVIRONMENT}/." "${tmp}/"
            sed -i "s|v0.0.0-unspecified|${VERSION}|g" "${tmp}"/*.yaml
            kubectl apply -f "${tmp}"
            rm -rf "${tmp}"
            kubectl rollout status "deployment/${service}" -n "${NAMESPACE}" --timeout=300s
          done
