name: Deploy Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment: test, uat or prod'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy; defaults to the dispatched commit'
        required: false
        type: string
      version:
        description: 'Image tag to deploy'
        required: true
        type: string
      services:
        description: 'JSON array of services to deploy'
        required: true
        type: string
    secrets:
      KUBECONFIG_B64:
        description: 'Base64 encoded kubeconfig for the target cluster'
        required: true

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      - name: Apply platform resources
        uses: Azure/k8s-deploy@v7
        with:
          namespace: ${{ inputs.namespace }}
          manifests: deploy/platform/${{ inputs.environment }}
          action: deploy
          strategy: basic
          timeout: 300s

  services:
    needs: platform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      - name: Deploy ${{ matrix.service }}
        uses: Azure/k8s-deploy@v7
        with:
          namespace: ${{ inputs.namespace }}
          manifests: apps/backend/${{ matrix.service }}/deploy/kubernetes/${{ inputs.environment }}
          images: crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com/pahaven/pawhaven-${{ matrix.service }}:${{ inputs.version }}
          action: deploy
          strategy: basic
          timeout: 300s
