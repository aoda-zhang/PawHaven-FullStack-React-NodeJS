name: Deploy Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment: test, uat or prod'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy; defaults to the dispatched commit'
        required: false
        type: string
      version:
        description: 'Image tag to deploy'
        required: true
        type: string
      services:
        description: 'JSON array of services to deploy'
        required: true
        type: string
      registry:
        description: 'Container registry host used for image pull credentials'
        required: true
        type: string
    secrets:
      KUBECONFIG_B64:
        description: 'Base64 encoded kubeconfig for the target cluster'
        required: true
      REGISTRY_USERNAME:
        description: 'Registry username for the image pull secret'
        required: true
      REGISTRY_PASSWORD:
        description: 'Registry password for the image pull secret'
        required: true

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      - name: Apply platform resources
        uses: Azure/k8s-deploy@v7
        with:
          namespace: ${{ inputs.namespace }}
          manifests: deploy/platform/${{ inputs.environment }}
          action: deploy
          strategy: basic
          timeout: 300s

      - name: Ensure the image pull secret
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl -n "${{ inputs.namespace }}" create secret docker-registry acr-pull \
            --docker-server="${REGISTRY}" \
            --docker-username="${REGISTRY_USERNAME}" \
            --docker-password="${REGISTRY_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Describe the platform failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          ns="${{ inputs.namespace }}"
          kubectl -n "${ns}" get all,networkpolicies,serviceaccounts,secrets || true
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -30 || true

  services:
    needs: platform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      - name: Deploy ${{ matrix.service }}
        uses: Azure/k8s-deploy@v7
        with:
          namespace: ${{ inputs.namespace }}
          manifests: apps/backend/${{ matrix.service }}/deploy/kubernetes/${{ inputs.environment }}
          images: crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com/pahaven/pawhaven-${{ matrix.service }}:${{ inputs.version }}
          action: deploy
          strategy: basic
          timeout: 300s

      - name: Describe the failed rollout
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          ns="${{ inputs.namespace }}"
          kubectl -n "${ns}" get pods -o wide || true
          kubectl -n "${ns}" describe deployment/${{ matrix.service }} || true
          for pod in $(kubectl -n "${ns}" get pods -l app.kubernetes.io/name=${{ matrix.service }} -o name 2>/dev/null); do
            kubectl -n "${ns}" describe "${pod}" | tail -40 || true
            kubectl -n "${ns}" logs "${pod}" --all-containers --tail=50 || true
          done
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -30 || true
