name: Deploy Kubernetes

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment: test, uat or prod'
        required: true
        type: string
      namespace:
        description: 'Target Kubernetes namespace'
        required: true
        type: string
      ref:
        description: 'Git ref to deploy; defaults to the dispatched commit'
        required: false
        type: string
      version:
        description: 'Image tag to deploy'
        required: true
        type: string
      services:
        description: 'JSON array of services to deploy'
        required: true
        type: string
      registry:
        description: 'Container registry host the cluster pulls images from'
        required: true
        type: string
    secrets:
      KUBECONFIG_B64:
        description: 'Base64 encoded kubeconfig for the target cluster'
        required: true
      REGISTRY_USERNAME:
        description: 'Registry username for the image pull secret'
        required: true
      REGISTRY_PASSWORD:
        description: 'Registry password for the image pull secret'
        required: true
      PAWHAVEN_SECRETS_JSON:
        description: 'JSON object with the pawhaven-secrets keys and values'
        required: true
      CF_ORIGIN_CERT:
        description: 'PEM contents of the Cloudflare Origin Certificate'
        required: false
      CF_ORIGIN_KEY:
        description: 'PEM private key for the Cloudflare Origin Certificate'
        required: false

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      # The platform manifests were part of the retired ECS setup; a target cluster only needs
      # the namespace, the pull secret and the runtime secret before the service is applied.
      - name: Ensure the namespace
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "${{ inputs.namespace }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure the image pull secret
        shell: bash
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl -n "${{ inputs.namespace }}" create secret docker-registry registry-pull \
            --docker-server="${REGISTRY}" \
            --docker-username="${REGISTRY_USERNAME}" \
            --docker-password="${REGISTRY_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure the runtime secret
        shell: bash
        env:
          SECRETS_JSON: ${{ secrets.PAWHAVEN_SECRETS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${SECRETS_JSON}" ]; then
            echo "::error::PAWHAVEN_SECRETS_JSON is not set. It must be a JSON object with JWT_SECRET, INTERNAL_JWT_PRIVATE_KEY, INTERNAL_JWT_PUBLIC_KEY, CORE_SERVICE_MONGODB, AUTH_SERVICE_MONGODB and BLOB_PUBLIC_BASE_URL."
            exit 1
          fi
          printf '%s' "${SECRETS_JSON}" | jq -r 'to_entries[] | "\(.key)=\(.value)"' > /tmp/pawhaven.env
          kubectl -n "${{ inputs.namespace }}" create secret generic pawhaven-secrets \
            --from-env-file=/tmp/pawhaven.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/pawhaven.env

      - name: Describe the platform failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          ns="${{ inputs.namespace }}"
          kubectl -n "${ns}" get all,networkpolicies,serviceaccounts,secrets || true
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -30 || true

  services:
    needs: platform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 -d >"${GITHUB_WORKSPACE}/.kube/config"
          chmod 600 "${GITHUB_WORKSPACE}/.kube/config"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify the kubeconfig
        shell: bash
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config
        run: |
          set -euo pipefail
          if [ ! -s "${KUBECONFIG}" ]; then
            echo "::error::The kubeconfig secret is empty. Set KUBECONFIG_<ENV> as base64 of a kubeconfig whose server is reachable from GitHub runners."
            exit 1
          fi
          echo "KUBECONFIG=${KUBECONFIG}" >>"${GITHUB_ENV}"
          kubectl config current-context
          kubectl cluster-info

      - name: Deploy ${{ matrix.service }}
        shell: bash
        env:
          IMAGE: ${{ inputs.registry }}/pahaven/pawhaven-${{ matrix.service }}:${{ inputs.version }}
          NAMESPACE: ${{ inputs.namespace }}
          SERVICE: ${{ matrix.service }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          source_dir="apps/backend/${SERVICE}/deploy/kubernetes/${ENVIRONMENT}"
          work_dir="$(mktemp -d)"
          cp "${source_dir}"/*.yaml "${work_dir}/"
          sed -i -E "s#^([[:space:]]*image:).*#\1 ${IMAGE}#" "${work_dir}"/*.yaml
          grep -Hn "image:" "${work_dir}"/*.yaml
          kubectl apply -n "${NAMESPACE}" -f "${work_dir}"
          rm -rf "${work_dir}"
          kubectl rollout status "deployment/${SERVICE}" -n "${NAMESPACE}" --timeout=600s

      - name: Smoke check ${{ matrix.service }}
        shell: bash
        env:
          NAMESPACE: ${{ inputs.namespace }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "${SERVICE}" in
            gateway) PORT=8080 ;;
            core-service) PORT=8081 ;;
            auth-service) PORT=8082 ;;
            *) echo "::error::No smoke-check port for ${SERVICE}"; exit 1 ;;
          esac
          for attempt in $(seq 1 30); do
            if kubectl -n "${NAMESPACE}" exec "deploy/${SERVICE}" -- \
              node -e "fetch('http://127.0.0.1:${PORT}/').then((r) => { console.log('HTTP', r.status); process.exit(r.status < 500 ? 0 : 1); }).catch((error) => { console.error('SMOKE FAIL', error.message); process.exit(1); });"; then
              echo "Smoke check passed on port ${PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Smoke check failed for ${SERVICE} on port ${PORT}"
          exit 1

      - name: Describe the failed rollout
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          ns="${{ inputs.namespace }}"
          kubectl -n "${ns}" get pods -o wide || true
          kubectl -n "${ns}" describe deployment/${{ matrix.service }} || true
          for pod in $(kubectl -n "${ns}" get pods -l app.kubernetes.io/name=${{ matrix.service }} -o name 2>/dev/null); do
            kubectl -n "${ns}" describe "${pod}" | tail -40 || true
            kubectl -n "${ns}" logs "${pod}" --all-containers --tail=50 || true
          done
          kubectl -n "${ns}" get events --sort-by=.lastTimestamp | tail -30 || true
