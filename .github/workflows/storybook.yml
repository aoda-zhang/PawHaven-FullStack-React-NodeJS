name: Storybook

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/ui/**'
      - 'packages/design-system/**'
      - '.github/workflows/storybook.yml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/design-system/**'
      - '.github/workflows/storybook.yml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

# Pull requests cancel superseded runs of the same PR; pushes to main cancel superseded
# pushes. Any other event gets its own run id so it never joins a PR or push group.
concurrency:
  group: storybook-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build component catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pawhaven/ui exec playwright install --with-deps chromium

      - name: Run Storybook accessibility tests
        run: pnpm --filter @pawhaven/ui test-storybook

      - name: Build Storybook
        run: pnpm --filter @pawhaven/ui build-storybook

      - name: Verify required component stories
        run: node packages/ui/scripts/verify-stories.mjs
