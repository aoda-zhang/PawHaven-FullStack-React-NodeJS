# Quality gate: lint, typecheck, automated tests, accessibility checks and a production build.
# React Doctor stays in its own workflow (react-doctor.yml). release.yml calls this
# workflow as a reusable gate; it never deploys anything itself.
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Pull requests cancel superseded runs of the same PR; pushes to main cancel superseded
# pushes. Any other trigger (including a reusable call, where github.event_name is the
# caller's event) gets its own run id so it never joins a PR or push group.
concurrency:
  group: test-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, accessibility and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Node.js version from package.json
        id: node_version
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION=$(node -p "require('./package.json').engines?.node || ''")
          if [[ -z "${NODE_VERSION}" ]]; then
            echo "Missing engines.node in package.json" >&2
            exit 1
          fi
          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.node_version }}

      - name: Enable package manager from package.json
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        shell: bash
        run: pnpm --filter @pawhaven/core-service --filter @pawhaven/auth-service prisma:generate-mongodb

      - name: Build shared packages
        shell: bash
        run: pnpm build:libs

      - name: Architecture boundaries
        shell: bash
        run: pnpm architecture-check

      - name: Design token audit
        shell: bash
        run: pnpm token-check

      - name: Repository quality
        shell: bash
        run: pnpm quality-check

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: pnpm typecheck

      - name: Check translation keys
        shell: bash
        run: pnpm check:i18n

      - name: Install Chromium for Storybook accessibility tests
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook accessibility tests (axe)
        shell: bash
        run: pnpm --filter @pawhaven/ui test-storybook

      - name: Tests
        shell: bash
        run: pnpm test

      - name: Build
        shell: bash
        run: pnpm build

  e2e:
    name: Critical journeys (chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve Node.js version from package.json
        id: node_version
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION=$(node -p "require('./package.json').engines?.node || ''")
          if [[ -z "${NODE_VERSION}" ]]; then
            echo "Missing engines.node in package.json" >&2
            exit 1
          fi
          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.node_version }}

      - name: Enable package manager from package.json
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        shell: bash
        run: pnpm test:e2e
