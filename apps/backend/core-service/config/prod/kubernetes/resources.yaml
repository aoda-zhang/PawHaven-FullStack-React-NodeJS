apiVersion: v1
kind: ConfigMap
metadata:
  name: core-service-config
data:
  NODE_ENV: "production"
  AUTH_SERVICE_HOST: "http://auth-service:8082"
  DOCUMENT_SERVICE_HOST: "http://document-service:8083"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  labels:
    app.kubernetes.io/name: core-service
    app.kubernetes.io/part-of: pawhaven
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-service
        app.kubernetes.io/part-of: pawhaven
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-service
          image: ghcr.io/aoda-zhang/pawhaven-core-service:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: core-service-config
          env:
            - name: CORE_SERVICE_MONGODB
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: CORE_SERVICE_MONGODB
            - name: INTERNAL_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: INTERNAL_JWT_PUBLIC_KEY
            - name: INTERNAL_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: INTERNAL_JWT_PRIVATE_KEY
            - name: BLOB_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: BLOB_PUBLIC_BASE_URL
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  labels:
    app.kubernetes.io/name: core-service
    app.kubernetes.io/part-of: pawhaven
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: core-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
