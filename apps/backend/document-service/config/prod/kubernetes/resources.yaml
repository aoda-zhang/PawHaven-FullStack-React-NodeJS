apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
data:
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: pawhaven
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
        app.kubernetes.io/part-of: pawhaven
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: document-service
          image: ghcr.io/aoda-zhang/pawhaven-document-service:prod
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: document-service-config
          env:
            - name: DOCUMENT_SERVICE_MONGODB
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: DOCUMENT_SERVICE_MONGODB
            - name: INTERNAL_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: INTERNAL_JWT_PUBLIC_KEY
            - name: DOCUMENT_READ_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: DOCUMENT_READ_WRITE_TOKEN
            - name: DOCUMENT_STORE_ID
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: DOCUMENT_STORE_ID
            - name: EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: EMAIL_SMTP_HOST
            - name: EMAIL_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: EMAIL_SMTP_USER
            - name: EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pawhaven-prod-secrets
                  key: EMAIL_SMTP_PASSWORD
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 640Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/part-of: pawhaven
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: document-service
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
