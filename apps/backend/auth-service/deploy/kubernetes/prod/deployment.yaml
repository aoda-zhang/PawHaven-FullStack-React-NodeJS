apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pawhaven-prod
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: pawhaven
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: pawhaven
    spec:
      serviceAccountName: pawhaven-runtime
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: crpi-1d0srkihv1btvqu3.cn-beijing.personal.cr.aliyuncs.com/pahaven/pawhaven-auth-service:v0.0.0-unspecified
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pawhaven-env
          env:
            - name: AUTH_SERVICE_MONGODB
              valueFrom:
                secretKeyRef:
                  name: pawhaven-secrets
                  key: AUTH_SERVICE_MONGODB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pawhaven-secrets
                  key: JWT_SECRET
            - name: INTERNAL_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: pawhaven-secrets
                  key: INTERNAL_JWT_PUBLIC_KEY
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
