packages:
  - apps/**
  - packages/**
  - libs/**
  # Exclude Prisma generated client directories
  - '!**/prisma/**/client'
  - '!**/src/prisma/**/client'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  puppeteer: true
  '@sparticuz/chromium-min': true
  unrs-resolver: true

# vitest 4 requires a matching coverage provider major; without this pin the
# resolver picks @vitest/coverage-v8@5 and vitest refuses to run coverage.
overrides:
  '@vitest/coverage-v8': 4.1.11

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - bcrypt
  - esbuild
  - protobufjs
  - '@sparticuz/chromium-min'
  - 'puppeteer'
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - turbo@2.11.3
