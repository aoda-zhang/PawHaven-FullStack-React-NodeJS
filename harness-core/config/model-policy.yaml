# Model policy — the one place an agent's intelligence is decided.
#
# An agent declares a TIER, never a model. This file resolves the tier. Nothing in canonical source
# names a provider or a model identifier; a provider belongs to an adapter, which is the only layer
# that knows what a runtime's model identifiers are called.
#
# `model: inherit` means "use whatever model the session runs on". This repository deliberately pins
# no provider, so every tier inherits today. Pinning one later is one line per tier here, and no
# agent changes.
#
# `fallback:` is an ordered list tried when the tier's model is unavailable. Empty, because nothing is
# pinned to fail over from.

version: 1

# The single source of truth for how intelligent an agent is. An agent declares `modelTier` in its
# own frontmatter (harness-core/plugins/<plugin>/agents/<name>.md); this file resolves that tier to a
# thinking level. Nothing in canonical source names a provider or a model identifier — a provider
# belongs to an adapter, the only layer that knows a runtime's model identifiers.
#
# `model: inherit` means "use whatever model the session runs on". This repository pins no provider,
# so every tier inherits today. Pinning one later is one line per tier here, and no agent changes.
#
# `fallback:` is an ordered list tried when the tier's model is unavailable. Empty, because nothing is
# pinned to fail over from.

tiers:
  # Cheap and mechanical: reading, locating, classifying. A wrong answer here is cheap to notice and
  # cheap to redo, so it does not deserve a deep-thinking budget.
  fast:
    purpose: reconnaissance, classification
    thinking: low
    model: inherit
    fallback: []

  # Work that writes or drives something and must self-check before it reports. `balanced` is the
  # harness's own measure, not a budget target: an agent that misses a failing check costs more than
  # the thinking it would have spent looking.
  balanced:
    purpose: implementation, testing, browser-verification
    thinking: medium
    model: inherit
    fallback: []

  # A wrong answer here is expensive to unwind: it is copied into every later stage, or it is the
  # judgement that lets a defect through. Orchestration, plan authorship, plan review, and the code
  # verdict are all this tier.
  strong:
    purpose: planning, architecture, review, orchestration
    thinking: high
    model: inherit
    fallback: []
