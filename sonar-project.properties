# SonarQube Cloud (OSS plan — free for public, OSI-licensed repositories).
# Fill in the two values from the project page after creating it at https://sonarcloud.io.
sonar.organization=aoda-zhang
sonar.projectKey=aoda-zhang_PawHaven-FullStack-React-NodeJS
sonar.projectName=PawHaven

sonar.sources=apps,packages,libs

# Generated, vendored and test-only files are not "source" for a maintainability rating.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/prisma/mongodb/client/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/*.stories.ts,**/*.stories.tsx

sonar.sourceEncoding=UTF-8
